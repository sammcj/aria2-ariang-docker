enable-rpc=true
rpc-allow-origin-all=true
# Allow external access
rpc-listen-all=true
# Default RPC port
rpc-listen-port=6800
disable-ipv6=true
# Maximum simultaneous downloads (number of tasks)
max-concurrent-downloads=6
continue=true
max-connection-per-server=16
# Minimum file fragment size for download threads
min-split-size=10M
# Maximum number of threads
split=14
# Download speed limit
max-overall-download-limit=0
max-download-limit=0
# Upload speed limit
max-overall-upload-limit=400K
max-upload-limit=200K
# File save path
dir=/aria2/data
# File pre-allocation method
file-allocation=prealloc

always-resume=true
content-disposition-default-utf8=true
enable-http-pipelining=true
http-accept-gzip=true
disk-cache=64M
retry-wait=3
max-tries=15

# General options
# log=/aria2/conf/aria2.log
# Log level - can be debug, info, notice, warn or error
# log-level=warn
console-log-level=notice

## Progress save related ##
# Read download tasks from session file
input-file=/aria2/conf/aria2.session
# Save unfinished download tasks to session file on exit
save-session=/aria2/conf/aria2.session
# Save session interval - 0 is only when exiting
save-session-interval=10

